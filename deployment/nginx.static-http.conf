server {
    listen 80;
    listen [::]:80;
    server_name biomod.faberhu.top;

    root /var/www/jlu-biomod/current;
    index index.html;

    access_log /var/log/nginx/biomod.access.log;
    error_log /var/log/nginx/biomod.error.log;

    # Keep ACME validation independent from the application and the OSS proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Historical BIOMOD sites are already stored in OSS. Preserve their
    # original URLs and proxy them through the public site domain.
    location ~ "^/archive/[0-9]{4}/" {
        proxy_pass https://jlu-biomod-assets.oss-cn-guangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_ssl_name jlu-biomod-assets.oss-cn-guangzhou.aliyuncs.com;
        proxy_set_header Host jlu-biomod-assets.oss-cn-guangzhou.aliyuncs.com;
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
    }

    # Next.js static export emits directory-style routes because
    # trailingSlash is enabled.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
