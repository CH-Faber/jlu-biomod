server {
    listen 80;
    server_name biomod.faberhu.top;
    
    # 强制将所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name biomod.faberhu.top;

    # SSL 证书路径 (请确保文件已上传至此路径)
    ssl_certificate /etc/nginx/ssl/biomod.pem;
    ssl_certificate_key /etc/nginx/ssl/biomod.key;

    # 推荐的 SSL 安全设置
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 开启 Gzip 压缩提升性能
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000; # 转发到 Next.js 默认端口
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 增加超时时间防止长连接断开
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 将原来的本地大文件存档请求，在服务器层面代理到 OSS
    # 仅将 /archive/年份/ (如 /archive/2016/...) 的请求代理到 OSS
    # 避免拦截 /archive 页面本身 (Next.js 路由)
    location ~ ^/archive/\d{4}/ {
        # 使用反向代理而不是重定向，防止浏览器将 HTML 当作附件下载
        proxy_pass https://jlu-biomod-assets.oss-cn-guangzhou.aliyuncs.com;
        proxy_set_header Host jlu-biomod-assets.oss-cn-guangzhou.aliyuncs.com;
        
        # ⚠️ 关键点：强行清除 OSS 增加的下载头
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
    }

    # 可选：如果后续使用静态资源加速
    # location /_next/static {
    #     alias /var/www/jlu-biomod/.next/static;
    #     expires 365d;
    #     access_log off;
    # }
}
